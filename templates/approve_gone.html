<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Link no longer active</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
         background:#faf7f2; color:#2D1907; padding:24px }
  .box { max-width:420px; text-align:center }
  h1 { font-size:19px; margin:0 0 10px }
  p { font-size:13.5px; line-height:1.7; color:#7a6c5c; margin:0 }
</style>
</head>
<body>
  <div class="box">
    <h1>This approval link is no longer active</h1>
    <p>
      Status: <b>{{ state }}</b>. Ask the person who sent it to issue a new one —
      links expire, and are revoked once the payment run has been dealt with.<br><br>
      此链接已失效，请向发送人索取新链接。
    </p>
  </div>
</body>
</html>
