<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CATDAY — Sign in</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>🐱 CATDAY</h1>
    <div class="sub">Finance System 财务系统</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label style="text-align:center">Passcode 通行码</label>
      <input class="passfield" name="passcode" type="password" inputmode="numeric"
             autocomplete="one-time-code" maxlength="10" autofocus placeholder="••••••">
      <button type="submit">Enter 进入 →</button>
    </form>
    <div class="sub" style="margin-top:16px;font-size:11.5px">Your passcode identifies you — everyone has their own.</div>
  </div>
</div>
</body>
</html>
